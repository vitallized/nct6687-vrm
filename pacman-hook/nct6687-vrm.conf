# Persist VRM PMBus sensors across reboot / modprobe (NCT6687 eSIO patch).
# Disable with: options nct6687 vrm=0
# vrm_fast=31: no port pause (1) plus the four mailbox shortcuts (2, 4, 8, 16),
# tested on MS-7D89 2026-11-09 under a game load (README, "vrm_fast").
# 15 = without the one-write START, 1 = no shortcuts.
# vrm_eff_tau: efficiency averaging window in seconds (1..60).
# vrm_mux_keep=1 (optional, off here): leave the SMBus master's port and speed
# as the firmware set them when port 0 is already selected (README).
options nct6687 vrm=1 vrm_fast=31 vrm_eff_tau=10

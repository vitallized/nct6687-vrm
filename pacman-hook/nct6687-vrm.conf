# Persist VRM PMBus sensors across reboot / modprobe (NCT6687 eSIO patch).
# Disable with: options nct6687 vrm=0
# vrm_fast=15: no port pause (1) plus the three mailbox shortcuts (2, 4, 8),
# tested on MS-7D89 2026-11-08 (README, "vrm_fast"). 1 = no shortcuts.
# vrm_eff_tau: efficiency averaging window in seconds (1..60).
options nct6687 vrm=1 vrm_fast=15 vrm_eff_tau=10

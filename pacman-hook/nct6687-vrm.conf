# nct6687-vrm: options for the NCT6687 eSIO PMBus VRM sensors.
#
# Installed once as /etc/modprobe.d/nct6687-vrm.conf. Reinstalling never
# overwrites that copy, so edit it there. Options apply when nct6687 loads:
# at boot, or after   sudo modprobe -r nct6687 && sudo modprobe nct6687
# See what is live:   grep . /sys/module/nct6687/parameters/vrm*
#
# Every VRM option is set below, one per line, at the value this file ships
# with. "Default" is what the module uses when an option is left out.
# The stock driver's own options (fan_config, fan_mask, temp_mask, ...) are
# not set here; see   modinfo nct6687

# vrm: the VRM sensors.
#   1 = on. 0 = off: only the stock fan, temperature and voltage sensors.
#   Default 0. On a board other than MS-7D89, check the README first.
options nct6687 vrm=1

# vrm_gt: also read PMBus PAGE 1, the GT / iGPU rail ("VRM GT" channels).
#   0 = CPU rail only. 1 = CPU and GT; each refresh then switches PAGE both
#   ways, which costs EC time. The GT rail often reads 0 with a dGPU.
#   Default 0.
options nct6687 vrm_gt=0

# vrm_addr: the VR controller's PMBus address, 8-bit write form.
#   0xC0 (7-bit 0x60) on MS-7D89. Change it only after reading the new
#   address with the userspace reader (README). Default 0xC0.
options nct6687 vrm_addr=0xC0

# vrm_fast: speed-ups for how the driver talks to the EC. Add the bits:
#    1  port I/O without the port-0x80 pause after each access (VRM reads
#       and the stock fan/temp/voltage reads)
#    2  keep the control register value instead of reading it back
#    4  skip rewriting the protocol and address when they are unchanged
#    8  skip the CLEAR pulse after a transaction that ended cleanly
#   16  start each transaction with one write instead of two
#   Bits 2-16 switch themselves off until the next load after one failed
#   sample (dmesg says so). 0 = the access pattern of the first releases.
#   15 = all but 16. 31 = all; on MS-7D89 under a game load, 3.73 ms of CPU
#   per sample at 15 and 3.39 ms at 31 (README). Default 0.
options nct6687 vrm_fast=31

# vrm_mux_keep: leave the SMBus master's port and speed as the firmware set
#   them, as HWiNFO does, when the firmware already has port 0 selected.
#   Otherwise each refresh still forces port 0 and speed 0x03 and puts the
#   firmware's values back. 0 = always force and restore. 1 = leave them.
#   About 0.13 ms less CPU per sample on MS-7D89. Default 0.
options nct6687 vrm_mux_keep=0

# vrm_eff_tau: averaging window for VRM EFFICIENCY (pwm9), in seconds.
#   1 to 60; values outside are clamped. Shorter follows a change sooner
#   and is noisier: under a game load about +-3 points at 10, +-5 at 5,
#   +-6.5 at 3, +-10 at 1. Default 10.
options nct6687 vrm_eff_tau=10

# vrm_vout_exp: LINEAR16 exponent for VOUT, used only when the controller's
#   VOUT_MODE does not give one. MS-7D89 reports Direct (mV), so it is unused
#   there. -16 to 15; values outside are clamped. Default -10.
options nct6687 vrm_vout_exp=-10
